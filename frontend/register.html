<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — VVT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gray-50) 0%, var(--white) 100%);
            padding: 20px;
        }
        .auth-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--gray-200);
        }
        .auth-card .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .auth-card .logo .highlight {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--gray-600);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-card .form-group {
            margin-bottom: 16px;
        }
        .auth-card .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--gray-700);
            margin-bottom: 4px;
        }
        .auth-card .form-group input, .auth-card .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: var(--transition);
            font-family: inherit;
        }
        .auth-card .form-group input:focus, .auth-card .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
        }
        .auth-card .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .auth-card .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            margin-top: 8px;
        }
        .auth-card .btn-submit:hover {
            background: var(--primary-dark);
        }
        .auth-card .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .auth-card .auth-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--gray-600);
        }
        .auth-card .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        .auth-card .auth-footer a:hover {
            text-decoration: underline;
        }
        .auth-card .error-msg, .auth-card .success-msg {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .auth-card .error-msg {
            background: #F8D7DA;
            color: #721C24;
        }
        .auth-card .success-msg {
            background: #D4EDDA;
            color: #155724;
        }
        .role-specific {
            display: none;
        }
        .role-specific.show {
            display: block;
        }
        @media (max-width: 480px) {
            .auth-card .form-row {
                grid-template-columns: 1fr;
            }
            .auth-card {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <span>🌾</span>
                <span class="highlight">VVT</span>
            </div>
            <div class="subtitle">Create your account</div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg">Registration successful! Please login.</div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name <span style="color:var(--danger);">*</span></label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email <span style="color:var(--danger);">*</span></label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone <span style="color:var(--danger);">*</span></label>
                        <input type="tel" id="phone" placeholder="Enter phone number" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password <span style="color:var(--danger);">*</span></label>
                        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>I am a <span style="color:var(--danger);">*</span></label>
                        <select id="role" required>
                            <option value="">Select role</option>
                            <option value="farmer">👨‍🌾 Farmer</option>
                            <option value="buyer">🏢 Buyer</option>
                            <option value="transporter">🚚 Transporter</option>
                        </select>
                    </div>
                </div>

                <div class="role-specific" id="farmerFields">
                    <div class="form-group">
                        <label>Farm Name</label>
                        <input type="text" id="farmName" placeholder="Enter your farm name">
                    </div>
                    <div class="form-group">
                        <label>Farm Location</label>
                        <input type="text" id="farmLocation" placeholder="e.g., Kumbakonam" value="Kumbakonam">
                    </div>
                </div>

                <div class="role-specific" id="buyerFields">
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="companyName" placeholder="Enter your company name">
                    </div>
                </div>

                <div class="role-specific" id="transporterFields">
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="transCompanyName" placeholder="Enter your logistics company name">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="registerBtn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        document.getElementById('role').addEventListener('change', function() {
            const role = this.value;
            document.querySelectorAll('.role-specific').forEach(el => el.classList.remove('show'));
            if (role === 'farmer') document.getElementById('farmerFields').classList.add('show');
            if (role === 'buyer') document.getElementById('buyerFields').classList.add('show');
            if (role === 'transporter') document.getElementById('transporterFields').classList.add('show');
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const registerBtn = document.getElementById('registerBtn');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating account...';

            if (!role) {
                errorMsg.textContent = 'Please select a role';
                errorMsg.style.display = 'block';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
                return;
            }

            const data = {
                name, email, phone, password, role,
                farm_name: document.getElementById('farmName').value.trim(),
                location: document.getElementById('farmLocation').value.trim(),
                company_name: document.getElementById('companyName').value.trim() || 
                              document.getElementById('transCompanyName').value.trim()
            };

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    errorMsg.textContent = result.error || 'Registration failed';
                    errorMsg.style.display = 'block';
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Create Account';
                    return;
                }

                successMsg.textContent = result.message || 'Registration successful! Please login.';
                successMsg.style.display = 'block';
                document.getElementById('registerForm').reset();
                document.querySelectorAll('.role-specific').forEach(el => el.classList.remove('show'));
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
